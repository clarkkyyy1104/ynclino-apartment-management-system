<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1010" viewBox="0 0 1510 1010" role="img" aria-labelledby="title desc"><title id="title">Accounts, tenancy &amp; unit transfers</title><desc id="desc">UML class diagram of Identity, current occupancy, assignment history and transfer requests. Class cards list selected public properties. Solid lines are associations with multiplicities.</desc><style>
