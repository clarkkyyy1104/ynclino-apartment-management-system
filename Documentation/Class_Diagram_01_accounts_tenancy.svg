veInDate : DateTime?</text><text x="500" y="797" class="field">MoveOutDate : DateTime?</text><text x="500" y="819" class="field">LeaseStart : DateTime?</text><text x="500" y="841" class="field">LeaseEnd : DateTime?</text><text x="500" y="863" class="field">Status : string</text></g><g class="uml-class"><rect x="1020" y="608" width="390" height="290" rx="10" fill="#fff" stroke="#AAB8C8" stroke-width="1.5"/><path d="M 1030 608 H 1400 Q 1410 608 1410 618 V 664 H 1020 V 618 Q 1020 608 1030 608" fill="#9B5B13"/><text x="1040" y="636" class="class-title">UnitTransferRequest</text><text x="1040" y="655" class="model-name">C# tblUnitTransferRequest</text><line x1="1020" x2="1410" y1="666" y2="666" stroke="#FFF2DD" stroke-width="4"/><text x="1040" y="694" class="field key">TransferID : int {PK}</text><text x="1040" y="716" class="field key">TenantID : int {FK}</text><text x="1040" y="738" class="field key">CurrentUnitID : int? {FK}</text><text x="1040" y="760" class="field key">RequestedUnitID : int {FK}</text><text x="1040" y="782" class="field">Reason : string</text><text x="1040" y="804" class="field">Status : string</text><text x="1040" y="826" class="field">DateRequested : DateTime</text><text x="1040" y="848" class="field">DateReviewed : DateTime?</text><text x="1040" y="870" class="field">TenantArchivedAt : DateTime?</text><text x="1040" y="892" class="field">StaffArchivedAt : DateTime?</text></g><rect x="45" y="951" width="1420" height="38" rx="8" fill="#E8EDF4"/><text x="62" y="976" class="foot">User.Password maps to SQL PasswordHash. TenantProfile.UnitID is current; assignments retain history. Transfer.CurrentUnitID is a snapshot.</text></svg>