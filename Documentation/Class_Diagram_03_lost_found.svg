<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1010" viewBox="0 0 1510 1010" role="img" aria-labelledby="title desc"><title id="title">Lost &amp; Found and ownership claims</title><desc id="desc">UML class diagram of Admins and tenants report items; tenant ownership claims are reviewed by an admin. Class cards list selected public properties. Solid lines are associations with multiplicities.</desc><style>
  .heading{font:700 31px Arial,sans-serif;fill:#152439}.subheading{font:17px Arial,sans-serif;fill:#52647A}.class-title{font:700 22px Arial,sans-serif;fill:#fff}.model-name{font:13px Arial,sans-serif;fill:#DDE9F5}.field{font:15px Consolas,'Courier New',monospace;fill:#283648}.field.key{font-weight:700}.link-label{font:700 13px Arial,sans-serif;fill:#43566E}.multiplicity{font:700 14px Arial,sans-serif;fill:#334A66}.foot{font:15px Arial,sans-serif;fill:#43566E}.small{font:13px Arial,sans-serif;fill:#77879A}
  </style><rect width="1510" height="1010" fill="#F6F8FB"/><rect x="0" y="0" width="1510" height="8" fill="#284566"/><text x="45" y="55" class="heading">Lost &amp; Found and ownership claims</text><text x="45" y="84" class="subheading">Admins and tenants report items; tenant ownership claims are reviewed by an admin</text><text x="1455" y="55" text-anchor="end" class="small">SYSTEM CLASS DIAGRAM · 3 / 3</text><g class="uml-link"><polyline points="410,290 555,290" fill="none" stroke="#65778F" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="426.45" y="252" width="111.1" height="27" rx="13.5" fill="#fff" stroke="#D4DDE8"/><text x="482" y="271" text-anchor="middle" class="link-label">reported by</text><text x="419" y="311" text-anchor="start" class="multiplicity">1</text><text x="546" y="311" text-anchor="end" class="multiplicity">0..*</text></g><g class="uml-link"><polyline points="410,402 555,402" fill="none" stroke="#65778F" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="430.5" y="364" width="103" height="27" rx="13.5" fill="#fff" stroke="#D4DDE8"/><text x="482" y="383" text-anchor="middle" class="link-label">claimed by</text><text x="419" y="423" text-anchor="start" class="multiplicity">0..1</text><text x="546" y="423" text-anchor="end" class="multiplicity">0..*</text></g><g class="uml-link"><polyline points="955,300 1105,300" fill="none" stroke="#65778F" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="989" y="262" width="82" height="27" rx="13.5" fill="#fff" stroke="#D4DDE8"/><text x="1030" y="281" text-anchor="middle" class="link-label">claims</text><text x="964" y="321" text-anchor="start" class="multiplicity">1</text><text x="1096" y="321" text-anchor="end" class="multiplicity">0..*</text></g><g class="uml-link"><polyline points="228,483 228,718 1280,718 1280,461" fill="none" stroke="#65778F" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="711.6" y="681" width="86.8" height="27" rx="13.5" fill="#fff" stroke="#D4DDE8"/><text x="755" y="700" text-anchor="middle" class="link-label">claimant</text><text x="240" y="504" text-anchor="start" class="multiplicity">1</text><text x="1292" y="482" text-anchor="start" class="multiplicity">0..*</text></g><g class="uml-class"><rect x="45" y="215" width="365" height="268" rx="10" fill="#fff" stroke="#AAB8C8" stroke-width="1.5"/><path d="M 55 215 H 400 Q 410 215 410 225 V 271 H 45 V 225 Q 45 215 55 215" fill="#233B62"/><text x="65" y="243" class="class-title">User</text><text x="65" y="262" class="model-name">C# tblUser</text><line x1="45" x2="410" y1="273" y2="273" stroke="#E8F0FC" stroke-width="4"/><text x="65" y="301" class="field key">UserID : int {PK}</text><text x="65" y="323" class="field">Username : string</text><text x="65" y="345" class="field">Role : string {RoleID}</text><text x="65" y="367" class="field">FirstName : string</text><text x="65" y="389" class="field">LastName : string</text><text x="65" y="411" class="field">Email : string?</text><text x="65" y="433" class="field">ContactNumber : string?</text><text x="65" y="455" class="field">IsActive : bool</text><text x="65" y="477" class="field">DisplayName : string {derived}</text></g><g class="uml-class"><rect x="555" y="164" width="400" height="312" rx="10" fill="#fff" stroke="#AAB8C8" stroke-width="1.5"/><path d="M 565 164 H 945 Q 955 164 955 174 V 220 H 555 V 174 Q 555 164 565 164" fill="#A33F5A"/><text x="575" y="192" class="class-title">LostFoundItem</text><text x="575" y="211" class="model-name">C# tblLostFoundItem</text><line x1="555" x2="955" y1="222" y2="222" stroke="#FCEBF0" stroke-width="4"/><text x="575" y="250" class="field key">ItemID : int {PK}</text><text x="575" y="272" class="field key">ReportedByUserID : int {FK}</text><text x="575" y="294" class="field key">ClaimedByUserID : int? {FK}</text><text x="575" y="316" class="field">ItemName : string</text><text x="575" y="338" class="field">ItemType : string</text><text x="575" y="360" class="field">Location : string?</text><text x="575" y="382" class="field">Status : string</text><text x="575" y="404" class="field">DateReported : DateTime</text><text x="575" y="426" class="field">DateClaimed : DateTime?</text><text x="575" y="448" class="field">ArchivedAt : DateTime?</text><text x="575" y="470" class="field">ImagePath : string?</text></g><g class="uml-class"><rect x="1105" y="215" width="350" height="246" rx="10" fill="#fff" stroke="#AAB8C8" stroke-width="1.5"/><path d="M 1115 215 H 1445 Q 1455 215 1455 225 V 271 H 1105 V 225 Q 1105 215 1115 215" fill="#A33F5A"/><text x="1125" y="243" class="class-title">ClaimRequest</text><text x="1125" y="262" class="model-name">C# tblClaimRequest</text><line x1="1105" x2="1455" y1="273" y2="273" stroke="#FCEBF0" stroke-width="4"/><text x="1125" y="301" class="field key">ClaimID : int {PK}</text><text x="1125" y="323" class="field key">ItemID : int {FK}</text><text x="1125" y="345" class="field key">ClaimantUserID : int {FK}</text><text x="1125" y="367" class="field">VerificationDetails : string</text><text x="1125" y="389" class="field">SubmittedAt : DateTime</text><text x="1125" y="411" class="field">Status : string</text><text x="1125" y="433" class="field">AdminNotes : string?</text><text x="1125" y="455" class="field">ImagePath : string?</text></g><rect x="45" y="951" width="1420" height="38" rx="8" fill="#E8EDF4"/><text x="62" y="976" class="foot">ClaimedByUserID is optional until handover. An approved claim closes an item; admins can also record a direct handover without an online claim.</text></svg>