.39999999999998" height="27" rx="13.5" fill="#fff" stroke="#D4DDE8"/><text x="473" y="736" text-anchor="middle" class="link-label">assigned staff</text><text x="419" y="776" text-anchor="start" class="multiplicity">0..1</text><text x="526" y="776" text-anchor="end" class="multiplicity">0..*</text></g><g class="uml-link"><polyline points="1050,755 925,755" fill="none" stroke="#65778F" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="932.45" y="717" width="111.1" height="27" rx="13.5" fill="#fff" stroke="#D4DDE8"/><text x="988" y="736" text-anchor="middle" class="link-label">repair unit</text><text x="1041" y="776" text-anchor="end" class="multiplicity">0..1</text><text x="934" y="776" text-anchor="start" class="multiplicity">0..*</text></g><g class="uml-class"><rect x="45" y="155" width="365" height="202" rx="10" fill="#fff" stroke="#AAB8C8" stroke-width="1.5"/><path d="M 55 155 H 400 Q 410 155 410 165 V 211 H 45 V 165 Q 45 155 55 155" fill="#176A6C"/><text x="65" y="183" class="class-title">TenantProfile</text><text x="65" y="202" class="model-name">C# tblTenant</text><line x1="45" x2="410" y1="213" y2="213" stroke="#E4F5F2" stroke-width="4"/><text x="65" y="241" class="field key">TenantID : int {PK}</text><text x="65" y="263" class="field key">UserID : int? {FK}</text><text x="65" y="285" class="field key">UnitID : int? {FK}</text><text x="65" y="307" class="field">FullName : string {derived}</text><text x="65" y="329" class="field">Status : string</text><text x="65" y="351" class="field">AdvanceCredit : decimal</text></g><g class="uml-class"><rect x="535" y="113" width="390" height="334" rx="10" fill="#fff" stroke="#AAB8C8" stroke-width="1.5"/><path d="M 545 113 H 915 Q 925 113 925 123 V 169 H 535 V 123 Q 535 113 545 113" fill="#6947A1"/><text x="555" y="141" class="class-title">Billing</text><text x="555" y="160" class="model-name">C# tblBilling</text><line x1="535" x2="925" y1="171" y2="171" stroke="#F0EAFB" stroke-width="4"/><text x="555" y="199" class="field key">BillingID : int {PK}</text><text x="555" y="221" class="field key">TenantID : int {FK}</text><text x="555" y="243" class="field">BillingPeriod : DateTime</text><text x="555" y="265" class="field">AmountDue : decimal</text><text x="555" y="287" class="field">AmountPaid : decimal? {cache}</text><text x="555" y="309" class="field">Deposit : decimal</text><text x="555" y="331" class="field">Advance : decimal</text><text x="555" y="353" class="field">DueDate : DateTime</text><text x="555" y="375" class="field">AdvanceFromOverpayment : decimal</text><text x="555" y="397" class="field">DatePaid : DateTime? {cache}</text><text x="555" y="419" class="field">Status : string</text><text x="555" y="441" class="field">ArchivedAt : DateTime?</text></g><g class="uml-class"><rect x="1050" y="155" width="340" height="224" rx="10" fill="#fff" stroke="#AAB8C8" stroke-width="1.5"/><path d="M 1060 155 H 1380 Q 1390 155 1390 165 V 211 H 1050 V 165 Q 1050 155 1060 155" fill="#6947A1"/><text x="1070" y="183" class="class-title">Payment</text><text x="1070" y="202" class="model-name">C# tblPayment</text><line x1="1050" x2="1390" y1="213" y2="213" stroke="#F0EAFB" stroke-width="4"/><text x="1070" y="241" class="field key">PaymentID : int {PK}</text><text x="1070" y="263" class="field key">BillingID : int {FK}</text><text x="1070" y="285" class="field">Amount : decimal</text><text x="1070" y="307" class="field">DatePaid : DateTime</text><text x="1070" y="329" class="field">Method : string?</text><text x="1070" y="351" class="field">Remarks : string?</text><text x="1070" y="373" class="field">RecordedAt : DateTime</text></g><g class="uml-class"><rect x="45" y="668" width="365" height="158" rx="10" fill="#fff" stroke="#AAB8C8" stroke-width="1.5"/><path d="M 55 668 H 400 Q 410 668 410 678 V 724 H 45 V 678 Q 45 668 55 668" fill="#233B62"/><text x="65" y="696" class="class-title">User</text><text x="65" y="715" class="model-name">C# tblUser</text><line x1="45" x2="41