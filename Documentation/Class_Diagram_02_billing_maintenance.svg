 : int {PK}</text><text x="1070" y="776" class="field">UnitNumber : string</text><text x="1070" y="798" class="field">UnitType : string</text><text x="1070" y="820" class="field">Status : string</text></g><rect x="45" y="951" width="1420" height="38" rx="8" fill="#E8EDF4"/><text x="62" y="976" class="foot">Payments is the ledger. Billing.AmountPaid and Billing.DatePaid are synchronized summaries. AssignedStaffID maps to AssignedStaffUserID in SQL.</text></svg>